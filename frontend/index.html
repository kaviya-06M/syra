    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYRA</title>
    <script>
      (function() {
        try {
          var _fetch = window.fetch || globalThis.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(v) {
              _fetch = v;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/renderer/main.tsx"></script>
